version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env  
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://localhost:8001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped 