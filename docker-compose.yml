version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env  
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build: .
    command: python mcp.py
    ports:
      - "7001:7001"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/tools"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      # args:
        # - REACT_APP_API_BASE_URL=http://ddns.i2g.cloud:8001/api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped 